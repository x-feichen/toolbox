# ToolBox full-stack deployment.
#
#   cp .env.example .env    # adjust secrets first (SESSION_SECRET!)
#   docker compose up -d --build
#
# Entry point: http://localhost (nginx) — single origin for the browser:
#   /          → Next.js frontend
#   /api/v1/*  → FastAPI backend
#
# For backend-only development against a local IDE workflow, start just the
# database: `docker compose up -d postgres` (port 5432 is bound to localhost).

services:
  postgres:
    image: postgres:16
    container_name: toolbox-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-toolbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toolbox}
      POSTGRES_DB: ${POSTGRES_DB:-toolbox}
    # localhost-only binding: the IDE toolchain can connect, the internet cannot.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-toolbox} -d ${POSTGRES_DB:-toolbox}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    # Pinned to a locally available release (Docker Hub is unreachable in the
    # current network); bump freely when a registry mirror is configured.
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: toolbox-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      # Console for local administration only; the S3 API (9000) stays on the
      # container network — the backend proxies avatar reads.
      - "127.0.0.1:9001:9001"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: toolbox-backend
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-toolbox}:${POSTGRES_PASSWORD:-toolbox}@postgres:5432/${POSTGRES_DB:-toolbox}
      # Change this in .env! Used for session cookie security decisions.
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      # Comma-separated emails that receive the admin role on registration.
      # e.g. ADMIN_EMAILS=ops@example.com,cto@example.com
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-avatars}
      # Same-origin requests are allowed automatically (Origin is compared
      # with Host), so list extra origins here only for split deployments.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Empty = same-origin: the browser calls /api/* on the current host and
        # nginx forwards it, so the deployment works on any domain/IP as-is.
        # Set only for a split deployment (separate API origin).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: toolbox-frontend
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: toolbox-nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
