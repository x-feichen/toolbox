# Docker's embedded DNS (127.0.0.11) with a short TTL: upstream container IPs
# change on every recreate, and a static `server backend:8000;` would keep
# pointing at a stale IP (502) until nginx itself restarts.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    # Unified entry: same-origin for the browser, so cookies (SameSite=Lax)
    # work without extra CORS configuration.
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAPI schema is served outside the /api prefix by FastAPI.
    location = /openapi.json {
        set $backend http://backend:8000;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
    }

    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade headers (HMR / Next dev overlays).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
