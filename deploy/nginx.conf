upstream toolbox_frontend {
    server frontend:3000;
}

upstream toolbox_backend {
    server backend:8000;
}

server {
    listen 80;

    # Unified entry: same-origin for the browser, so cookies (SameSite=Lax)
    # work without extra CORS configuration.
    location /api/ {
        proxy_pass http://toolbox_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAPI schema is served outside the /api prefix by FastAPI.
    location = /openapi.json {
        proxy_pass http://toolbox_backend;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://toolbox_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade headers (Next dev overlays / future features).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
