# Development overlay: hot-reloading backend + frontend with source mounted.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# What it changes (production defaults in docker-compose.yml stay intact):
#   backend   → uvicorn --reload with ./backend/app mounted (Python edits apply instantly)
#   frontend  → `next dev` with ./frontend/src + ./packages/api-client/src mounted (HMR)
#
# Same entry point as production: http://localhost (nginx → dev containers).
# Dependency changes (pyproject.toml / package.json) still require a rebuild:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Notes:
#  - node_modules / .venv come from the image and are NOT mounted (host copies
#    are platform-specific and would break inside the container).
#  - Polling watchers are enabled: reliable change detection on Windows/macOS
#    bind mounts at a small CPU cost.

services:
  backend:
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    environment:
      APP_ENV: development
      WATCHFILES_FORCE_POLLING: "true"
    command: >
      sh -c "uv run --no-sync alembic upgrade head &&
             uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"

  frontend:
    # Use the build stage as the dev image: it carries the full frontend
    # source tree plus tsconfig/postcss/next.config (which the slim runtime
    # stage intentionally omits), so `next dev` can compile on the fly.
    # A distinct image name keeps it from clobbering the production image.
    image: toolbox-frontend-dev
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: build
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./packages/api-client/src:/app/packages/api-client/src
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    command: ["pnpm", "--filter", "@toolbox/frontend", "dev"]
